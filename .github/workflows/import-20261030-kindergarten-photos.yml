name: Import oneballoon kindergarten graduation photos (one-time)
on:
  push:
    branches:
      - content/2026-10-30-kindergarten-graduation-daisy
    paths:
      - '.github/workflows/import-20261030-kindergarten-photos.yml'
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve owner's published photos and optimize for the website
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import io, os, re, sys, time
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps
          from urllib.parse import urlparse, urljoin
          from pathlib import Path
          blog_id = "oneballoon_topper"
          log_no = "224459502751"
          sources = [
            f"https://m.blog.naver.com/PostView.naver?blogId={blog_id}&logNo={log_no}",
            f"https://blog.naver.com/PostView.naver?blogId={blog_id}&logNo={log_no}",
            f"https://m.blog.naver.com/{blog_id}/{log_no}",
          ]
          names = [
            "261007_유치원졸업식_강당포토존_AI합성시안.webp",
            "261007_유치원졸업식_파스텔풍선아치_포토존전체.webp",
            "261007_유치원졸업식_데이지꽃풍선_아치장식.webp",
            "261007_유치원졸업식_축하가랜드_꽃풍선장식.webp",
            "261007_유치원졸업식_골드레터링_풍선포토존.webp",
            "261007_유치원졸업식_졸업생캐릭터_입간판.webp",
            "261007_유치원졸업식_2026숫자풍선_별풍선.webp",
            "261007_유치원졸업식_졸업가운_기념촬영.webp",
            "261007_유치원졸업식_졸업사진_포토존촬영.webp",
            "261007_유치원졸업식_파스텔풍선아치_AI강당시안.webp",
          ]
          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36", "Referer": "https://blog.naver.com/", "Accept-Language": "ko-KR,ko;q=0.9"})
          links=[]
          for url in sources:
            try:
              response=s.get(url,timeout=25)
              print("BLOG:", response.status_code, response.url, len(response.content))
              response.raise_for_status()
              soup=BeautifulSoup(response.text,"html.parser")
              container=soup.select_one(".se-main-container") or soup.select_one("#postViewArea") or soup.select_one("#post-view") or soup
              images=container.select("img.se-image-resource")
              if not images:
                images=[tag for tag in container.select("img") if any("pstatic.net" in str(tag.get(a,"")) for a in ["src","data-src","data-lazy-src","data-original"])]
              found=[]
              for tag in images:
                for attr in ["data-lazy-src","data-src","data-original","src"]:
                  val=tag.get(attr,"")
                  if ("postfiles.pstatic.net/" in val or "blogfiles.pstatic.net/" in val) and val not in found:
                    found.append(val if val.startswith("http") else "https:"+val)
                    break
              if len(found)>=10:
                links=found
                break
              print("Could not find 10 post images at",url,"found",len(found))
            except Exception as e: print("Error fetching",url,str(e))
          if len(links)<10:
            raise RuntimeError("No complete image list in public Naver post; keep case unpublished.")
          if len(links)>10:
            print("Blog contains",len(links),"images. Excluding the first introductory brand logo and keeping the last ten photo images.")
            if len(links)!=11:
              raise RuntimeError("Unexpected article image count; manual review required.")
            links=links[1:]
          out=Path("src/assets/uploads")
          out.mkdir(parents=True,exist_ok=True)
          for i,(filename,url) in enumerate(zip(names,links),start=1):
            r=s.get(url,timeout=40,headers={"Referer":"https://blog.naver.com/"})
            r.raise_for_status()
            im=ImageOps.exif_transpose(Image.open(io.BytesIO(r.content))).convert("RGB")
            if im.width>1600:
              im.thumbnail((1600,3000),Image.Resampling.LANCZOS)
            dest=out/filename
            im.save(dest,format="WEBP",quality=82,method=6)
            print("IMAGE",i,filename,"dimensions",im.size,"bytes",dest.stat().st_size)
          PY
      - name: Save files to case branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/uploads/261007_유치원졸업식_*.webp
          git diff --cached --quiet || (git commit -m "Upload 10 graduation photos from owner's Naver blog" && git push)
