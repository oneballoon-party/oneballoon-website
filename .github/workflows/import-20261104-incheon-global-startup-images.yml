name: Import Incheon Global Startup School booth photos (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-20261104-incheon-global-startup-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Store original exhibition photos as local website assets
        run: node scripts/cache-incheon-global-startup-images.mjs
      - name: Commit five photos and fix their website image paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/uploads/20261014-incheon-global-startup-school-booth-* src/cases/2026-11-04-incheon-global-startup-school-expo-booth.md
          if ! git diff --cached --quiet; then
            git commit -m "Host Incheon Global Startup School booth photos locally"
            git push
          else
            echo "Expo photos already imported"
          fi
