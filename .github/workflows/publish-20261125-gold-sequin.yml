name: Publish verified gold sequin graduation photos
on:
  push:
    branches: [publish-graduation-gold-sequin-20261125]
    paths: ['.github/workflows/publish-20261125-gold-sequin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve and verify the six requested photographs
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import re, html, io, itertools, pathlib, urllib.parse, requests
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter
          from concurrent.futures import ThreadPoolExecutor
          targets=[
              ('f121e420e8e42626','3f9d3e1c0036b793',4/3),
              ('e1c3c4ccc258cc4e','ff397e7e38002622',4/3),
              ('0ff1c0c0d8ccce4e','ff7f387800462307',3/4),
              ('1ed9c0c2c9cccf4f','ff7c7c7800672303',3/4),
              ('81c7881844f2706c','fff0fefce0181e06',3/4),
              ('fe7878cadafa79f0','ff0f0f3f7f0f0010',3/4)]
          targets=[(int(d,16),int(a,16),r) for d,a,r in targets]
          headers={'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36','Referer':'https://m.blog.naver.com/oneballoon_topper/224488720602'}
          pages=['https://m.blog.naver.com/oneballoon_topper/224488720602','https://m.blog.naver.com/PostView.naver?blogId=oneballoon_topper&logNo=224488720602','https://blog.naver.com/PostView.naver?blogId=oneballoon_topper&logNo=224488720602']
          urls=set()
          for page in pages:
              try:
                  r=requests.get(page,headers=headers,timeout=20)
                  print('Post response',r.status_code,len(r.content))
                  s=html.unescape(r.text).replace('\\/','/').replace('\\u0026','&')
                  for v in re.findall(r'https?://(?:blogfiles|postfiles|blogthumb|mblogthumb-phinf|blogpfthumb-phinf|blog-phinf|post-phinf)\.pstatic\.net/[^\s"\'<>\\]+',s):
                      v=html.unescape(v).split('?')[0].rstrip('),;')
                      if len(v)>70:
                          urls.add(v)
                  print('Candidate URLs so far:',len(urls))
              except Exception as e: print('Post retrieval:',type(e).__name__)
          print('Image candidates',len(urls))
          print('Candidate hosts',sorted(set(urllib.parse.urlparse(u).hostname for u in urls)))
          if len(urls)<6: raise SystemExit('Not enough candidate photographs; no publication')
          def fetch(u):
              for query in ['', '?type=w2','?type=w1']:
                  try:
                      r=requests.get(u+query,headers=headers,timeout=20)
                      r.raise_for_status()
                      im=ImageOps.exif_transpose(Image.open(io.BytesIO(r.content))).convert('RGB')
                      if min(im.size)<600: continue
                      g=list(im.convert('L').resize((9,8),Image.Resampling.LANCZOS).getdata())
                      d=sum((g[y*9+x]>g[y*9+x+1])<<(y*8+x) for y in range(8) for x in range(8))
                      g=list(im.convert('L').resize((8,8),Image.Resampling.LANCZOS).getdata())
                      a=sum((v>sum(g)/64)<<i for i,v in enumerate(g))
                      return (u,im,d,a)
                  except Exception: pass
              return None
          with ThreadPoolExecutor(max_workers=8) as pool:
              images=[x for x in pool.map(fetch,sorted(urls)[:100]) if x]
          rgb=[[148,160,171,124,135,147,129,129,130,130,130,131,117,129,127,136,138,138,131,134,131,105,109,111,103,108,82,187,162,126,165,163,157,81,101,87,154,140,118,201,183,149,189,176,164,125,119,105],
               [142,154,161,129,145,159,129,132,134,141,141,144,94,104,88,148,137,119,150,144,134,106,123,114,117,120,96,184,161,117,207,191,180,133,138,129,150,134,114,183,166,135,217,202,180,144,131,119],
               [157,167,181,127,133,140,122,123,125,105,102,102,124,135,137,133,135,139,138,135,133,129,137,134,118,115,92,177,151,107,199,180,165,127,128,123,195,176,152,205,188,160,216,196,167,192,169,139],
               [161,172,186,123,128,134,124,125,128,103,101,100,132,143,147,130,133,139,137,135,133,130,137,135,124,119,95,177,152,108,195,178,166,126,128,124,184,166,143,202,184,153,213,193,166,182,161,136],
               [141,147,157,141,159,176,126,140,159,119,122,129,85,103,93,132,127,110,146,136,129,150,131,107,91,100,72,153,142,122,183,155,105,196,169,129,174,148,120,142,130,116,202,181,145,209,188,153],
               [130,127,116,137,139,141,93,105,101,84,106,101,182,172,170,187,175,185,146,146,131,88,113,71,196,183,183,207,195,203,136,139,151,108,92,69,209,190,164,214,198,177,129,115,101,95,83,70]]
          chosen=[]
          for i,(d,a,ratio) in enumerate(targets):
              scores=[]
              for u,im,di,ai in images:
                  if abs(im.width/im.height-ratio)>=0.03: continue
                  hd=(d^di).bit_count()+(a^ai).bit_count()
                  thumb=[v for p in im.resize((4,4),Image.Resampling.LANCZOS).getdata() for v in p]
                  err=sum(abs(x-y) for x,y in zip(thumb,rgb[i]))/48
                  if hd<=8 and err<=6: scores.append((hd+2*err,hd,err,u,im))
              scores.sort(key=lambda x:(x[0],-x[4].width*x[4].height))
              print('Photo',i+1,'candidate scores',[(round(s[0],2),s[1],round(s[2],2),s[4].size) for s in scores[:4]])
              if not scores: raise SystemExit(f'Photo {i+1} did not match; no publication')
              score,hd,err,u,im=scores[0]
              if u in [x[0] for x in chosen]: raise SystemExit('Duplicate match; no publication')
              if len(scores)>1 and scores[1][0]-score<2:
                  other=scores[1][4]
                  p=list(im.resize((32,32),Image.Resampling.LANCZOS).getdata())
                  q=list(other.resize((32,32),Image.Resampling.LANCZOS).getdata())
                  diff=sum(abs(a-b) for x,y in zip(p,q) for a,b in zip(x,y))/(32*32*3)
                  if diff>3: raise SystemExit('Ambiguous distinct match; no publication')
              print('Verified photo',i+1,'distance',hd,'RGB error',round(err,2),'size',im.size)
              chosen.append((u,im))
          dest=pathlib.Path('/tmp/gold-sequin-verified');dest.mkdir()
          for i,(_,im) in enumerate(chosen,1):
              if i==1:
                  im=ImageEnhance.Brightness(im).enhance(1.035)
              im.save(dest/f'20261125-graduation-gold-sequin-{i:02d}.webp',quality=91)
          PY
      - name: Publish only the verified case and six image files
        run: |
          cp src/cases/2026-11-25-school-graduation-gold-sequin-photozone.md /tmp/gold-sequin-verified/
          git fetch origin main
          git checkout -B main origin/main
          test ! -e src/cases/2026-11-25-school-graduation-gold-sequin-photozone.md
          cp /tmp/gold-sequin-verified/*.webp src/assets/uploads/
          cp /tmp/gold-sequin-verified/*.md src/cases/
          git add src/assets/uploads/20261125-graduation-gold-sequin-*.webp src/cases/2026-11-25-school-graduation-gold-sequin-photozone.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified school graduation gold sequin photozone"
          git push origin main
