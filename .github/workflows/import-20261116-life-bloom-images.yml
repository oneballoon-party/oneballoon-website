name: Import six Incheon exhibition photos to website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-20261116-life-bloom-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the current website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and store the six original exhibition photos
        run: node scripts/import-20261116-life-bloom-images.mjs
      - name: Commit local image files and update the case page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/uploads/20261116-incheon-life-bloom-exhibition-* src/cases/2026-11-16-incheon-yeongjong-life-bloom-poster-exhibition.md
          if ! git diff --cached --quiet; then
            git commit -m "Host six Incheon exhibition photos on website"
            git push
          else
            echo "Exhibition photographs are already locally hosted."
          fi
